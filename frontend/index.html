<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bus Route Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <h1>🚌 Bus Route Finder</h1>

    <div class="search-box">
      <input type="text" id="source" placeholder="Enter Source (e.g. Sangli)" />
      <input type="text" id="destination" placeholder="Enter Destination (e.g. Miraj)" />
      <button onclick="findRoute()">Find Route</button>
    </div>

    <div id="result" class="result-box"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
